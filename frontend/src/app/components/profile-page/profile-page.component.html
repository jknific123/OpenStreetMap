

<div class="container rounded bg-white mt-4 mb-4" style="top: 80px; max-width: 90%" *ngIf="currentUser; else loggedOut">

  <form class="form d-flex flex-column align-items-center text-center" [formGroup]="form" (submit)="submitUpdateUserData()">

        <img class="rounded-circle mt-3" width="130px" src="https://st3.depositphotos.com/15648834/17930/v/600/depositphotos_179308454-stock-illustration-unknown-person-silhouette-glasses-profile.jpg">
        <span class="font-weight-bold">{{currentUser.name}}</span>
        <span class="text-black-50">{{currentUser.email}}</span>

<!--        <div class="d-flex justify-content-between align-items-center mb-2">-->
<!--          <h4 class="text-right">Profile Settings</h4>-->
<!--        </div>-->

<!--        <div class="col-md-6">-->
<!--          <label class="labels"> Name </label>-->
<!--          <input type="text" class="form-control" formControlName="name">-->
<!--        </div>-->

<!--        <div class="col-md-6">-->
<!--          <label class="labels"> Email </label>-->
<!--          <input type="email" class="form-control" formControlName="email">-->
<!--        </div>-->

        <div class="col-md-4">
          <label class="labels"> Password </label>
          <input type="password" class="form-control text-center" formControlName="password">
          <div *ngIf="form.get('password')?.errors && form.get('password')?.errors?.['required'] && form.get('password')?.touched" class="alert-danger">Password is required</div>
        </div>

        <div class="col-md-4">
          <label class="labels"> Repeat password </label>
          <input type="password" class="form-control text-center" formControlName="password2">
          <div *ngIf="form.get('password2')?.errors && form.get('password2')?.errors?.['required'] && form.get('password2')?.touched" class="alert-danger">Repeat password is required</div>
          <div *ngIf="form.errors && form.errors['notSame'] && form.get('password2')?.touched" class="alert-danger">Passwords do not match</div>
        </div>

<!--        <div class="col-md-6">-->
<!--          <label class="labels"> Role </label>-->
<!--          <input type="text" class="form-control" formControlName="role">-->
<!--        </div>-->

        <div class="mt-3 mb-5 text-center" *ngIf="!isEditable">
          <button class="btn btn-primary profile-button" type="button" (click)="onClickEdit()">Edit profile</button>
        </div>

        <div class="d-flex  mt-3 mb-5 text-center" *ngIf="isEditable">

          <div>
            <button class="btn btn-primary profile-button mr-3" type="submit">Save new password</button>
          </div>

          <div>
            <button class="btn btn-primary profile-button ml-3" type="button" (click)="onClickCancleEdit()">Cancle</button>
          </div>

        </div>

  </form>

</div>

<ng-template #loggedOut>
  Please login.
</ng-template>
