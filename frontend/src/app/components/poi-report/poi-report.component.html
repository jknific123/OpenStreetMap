
<div class="container rounded bg-white mt-4 mb-4" style="top: 80px">
    <h1>Overall Rating: {{ locationReport.overall_rating | number: '1.2-2' }}</h1>
    <div *ngFor="let group of groupedMarkerEntries">
        <!-- Check if group.value is of type GroupedMarkers -->
        <ng-container *ngIf="group[1]?.groupRating !== undefined && group[1]?.markers">
            <h2>{{ group[0] }} - Rating: {{ group[1].groupRating | number: '1.2-2' }}</h2>
            <!-- Ensure markers is an array before iterating -->
            <ul *ngIf="Array.isArray(group[1].markers)">
                <li *ngFor="let marker of group[1].markers">
                    {{ marker.properties.name }} | {{ Math.floor(marker.properties.distance) }}m | {{ marker.rating | number: '1.2-2' }}
                </li>
            </ul>
        </ng-container>
    </div>

    <div class="d-flex flex-column align-items-center">
<!--      <button class="btn btn-primary mb-4 " type="button" (click)="onSaveSubmit()">Save location report</button>-->
      <button class="btn btn-primary mb-4 " type="button" (click)="openDialog()">Save location report</button>
    </div>

</div>

<app-base-modal [showModal]="showModal">

  <div class="d-flex flex-column gap-3">
          <label class="my-2" for="reportName">Please name your report</label>
          <input class="border p-3 my-2 mb-4" id="reportName" matInput [(ngModel)]="reportName" placeholder="Report name">
          <div class="d-flex" style="gap: 12px">
             <button class="btn btn-secondary flex-grow-1" type="button" (click)="showModal = false">cancel</button>
             <button class="btn btn-primary flex-grow-1" type="button" [disabled]="reportName.length < 1" (click)="onSaveSubmit()">Submit</button>
          </div>

  </div>

</app-base-modal>
