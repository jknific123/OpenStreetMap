<div class="form-signin w-100 m-auto">
  <form [formGroup]="form" (submit)="submit()">
    <h1 class="h3 mb-3 fw-normal">Please register!</h1>

    <div class="form-floating">
      <input formControlName="name" type="name" class="form-control" placeholder="Janez Novak">
    </div>

    <div class="form-floating">
      <input formControlName="email" type="email" class="form-control"  placeholder="name@example.com">
    </div>

    <div class="form-floating">
      <input formControlName="password" type="password" class="form-control" placeholder="Password">
    </div>

    <button class="btn btn-primary w-100 py-2" type="submit">Submit</button>

    <div class="alert alert-warning" *ngIf="isSignUpFailed">
      Signup failed!<br />{{ errorMessage }}
    </div>

    <div *ngIf="isSuccessful">Registration was successful!</div>

  </form>
</div>
