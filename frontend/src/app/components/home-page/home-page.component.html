<p>dashboard works!</p>


<div class="container w-100">
  <div class="row ">
    <div class="col-4 mb-1" *ngFor="let item of items">
      <div class="card">
            <h5 class="card-title" >{{item}}</h5>
      </div>
    </div>
  </div>

  <div class="row ">
    <div class="col-4 mb-1" *ngFor="let user of users">
      <div class="card">
            <h5 class="card-title" >{{user._id}}</h5>
            <p>{{user.name}}</p>
            <p>{{user.email}}</p>
            <p>{{user.role}}</p>
      </div>
    </div>
  </div>
</div>
