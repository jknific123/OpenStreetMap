<div class="home-page container rounded bg-white mt-4 mb-4">

  <div class="d-flex flex-column align-items-center text-center pt-4">

    <h3> Hello, {{this.user.name}}! </h3>

    <h5> Please choose the parameters that are important for quality of your life! </h5>

<!--    <p class="mt-2"> Modify the distances of your search: </p>-->
    <label class="mt-2"> Minimum distance represents your ideal range, while maximum distance defines your travel limit. </label>


        <!-- Distance Input Fields -->
    <div class="d-flex justify-content-center input-spacing mt-1 mb-2">
        <div>
            <label class="mr-2">Min distance:</label>
            <p-inputNumber [(ngModel)]="minDistance" inputId="min" [maxFractionDigits]=0 [min]="0" [max]="1999" mode="decimal" [useGrouping]="false" (onBlur)="validateMinMax()"> </p-inputNumber> m
        </div>

        <div>
            <label class="mr-2">Max distance:</label>
            <p-inputNumber [(ngModel)]="maxDistance" inputId="max" [min]="0" [max]="2000" mode="decimal" [useGrouping]="false" (onBlur)="validateMinMax()"> </p-inputNumber> m
        </div>
    </div>

    <!-- Display the error message if min is greater than max -->
    <div *ngIf="!isValidMinMax" class="text-danger mb-4">
        Min value should not be greater than Max value.
    </div>

  </div>

  <!-- PrimeNG TabView component -->
  <p-tabView [(activeIndex)]="activeIndex">

    <!-- Profiles Tab -->
    <p-tabPanel header="Profiles" [disabled]="disableProfilesHeader">
      <!-- PrimeNG Cards for Profiles -->
      <div class="equal-flex-container ">
